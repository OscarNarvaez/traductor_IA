services:
  - type: web
    name: traductor-ia-server
    runtime: node
    plan: free
    buildCommand: corepack enable && corepack prepare pnpm@11.17.0 --activate && pnpm install --frozen-lockfile && pnpm --filter server build
    startCommand: pnpm --filter server start
    envVars:
      - key: CORS_ORIGIN
        value: https://oscarnarvaez.github.io
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: GROQ_API_KEY
        sync: false
